<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MES 精细化工 - 质量 & 偏差追溯报表</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary-50: #E6F1FB; --primary-200: #B5D4F4; --primary-400: #378ADD;
    --primary-600: #185FA5; --primary-800: #0C447C; --primary-900: #042C53;
    --normal: #1D9E75; --normal-bg: #E1F5EE;
    --info: #EF9F27; --info-bg: #FAEEDA;
    --warning: #D85A30; --warning-bg: #FAECE7;
    --block: #E24B4A; --block-bg: #FCEBEB;
    --white: #FFFFFF; --page: #F1EFE8; --border: #D3D1C7;
    --text-sec: #888780; --text-sub: #5F5E5A; --text: #2C2C2A;
  }
  body { font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif; background: var(--page); color: var(--text); font-size: 14px; line-height: 1.6; overflow: hidden; height: 100vh; }
  .app { display: flex; height: 100vh; }
  .sidebar { width: 200px; min-width: 200px; background: var(--primary-800); color: #85B7EB; display: flex; flex-direction: column; overflow-y: auto; }
  .sidebar-logo { padding: 14px 16px; border-bottom: 1px solid var(--primary-600); display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; flex: none; }
  .sidebar-nav { padding: 8px 0; flex: 1; }
  .nav-item { padding: 8px 16px 8px 36px; font-size: 12.5px; color: #85B7EB; cursor: pointer; position: relative; transition: all 0.15s; display: flex; align-items: center; gap: 7px; }
  .nav-item:hover { background: var(--primary-900); color: #B5D4F4; }
  .nav-item.active { background: var(--primary-600); color: #FFF; font-weight: 500; }
  .nav-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--primary-400); }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { height: 52px; min-height: 52px; background: var(--white); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
  .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-sec); }
  .breadcrumb .current { color: var(--text); font-weight: 500; }
  .topbar-right { display: flex; align-items: center; gap: 20px; }
  .user-info { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
  .user-info:hover { background: var(--page); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary-600); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; }
  .user-name { font-size: 13px; color: var(--text); }
  .user-role { font-size: 11px; color: var(--text-sec); }
  .content { flex: 1; overflow-y: auto; padding: 14px 28px; }
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .page-title { font-size: 22px; font-weight: 500; color: var(--text); }
  .page-subtitle { font-size: 13px; color: var(--text-sec); margin-top: 2px; }
  .header-actions { display: flex; gap: 10px; }
  .btn { padding: 8px 18px; border-radius: 8px; font-size: 13px; cursor: pointer; border: none; font-family: inherit; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
  .btn-primary { background: var(--primary-600); color: #fff; }
  .btn-primary:hover { background: var(--primary-800); }
  .btn-secondary { background: var(--white); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--primary-400); color: var(--primary-600); }
  .metrics-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .metric-card { background: var(--white); border-radius: 10px; padding: 14px 16px; border: 1px solid var(--border); position: relative; overflow: hidden; }
  .metric-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .metric-card.blue::before { background: var(--primary-400); }
  .metric-card.green::before { background: var(--normal); }
  .metric-card.amber::before { background: var(--info); }
  .metric-card.gray::before { background: var(--text-sec); }
  .metric-label { font-size: 11px; color: var(--text-sec); margin-bottom: 6px; }
  .metric-value { font-family: "DIN Alternate", "Roboto", monospace; font-size: 26px; font-weight: 500; line-height: 1.1; }
  .metric-card.blue .metric-value { color: var(--primary-600); }
  .metric-card.green .metric-value { color: var(--normal); }
  .metric-card.amber .metric-value { color: var(--info); }
  .metric-card.gray .metric-value { color: var(--text-sub); }
  .metric-detail { font-size: 10px; color: var(--text-sec); margin-top: 4px; }
  .trend { font-size: 11px; font-weight: 500; margin-left: 6px; }
  .trend.up { color: var(--normal); }
  .trend.down { color: var(--block); }
  .filter-bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--page); flex-wrap: wrap; }
  .filter-group { display: flex; align-items: center; gap: 6px; }
  .filter-label { font-size: 12px; color: var(--text-sec); }
  .filter-select { padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; color: var(--text); background: var(--white); cursor: pointer; font-family: inherit; outline: none; }
  .filter-select:focus { border-color: var(--primary-400); }
  .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: var(--white); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
  .card.span2 { grid-column: 1 / -1; }
  .card-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .card-title { font-size: 15px; font-weight: 500; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .card-title .dot { width: 8px; height: 8px; border-radius: 50%; }
  .card-sub { font-size: 11px; color: var(--text-sec); }
  .card-body { padding: 16px 20px; }
  .card.chart .card-body { display: flex; align-items: center; min-height: 222px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-sub); }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; }
  .donut-wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .donut-legend { flex: 1; min-width: 160px; }
  .donut-legend .dl-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--page); font-size: 13px; }
  .donut-legend .dl-row:last-child { border-bottom: none; }
  .dl-left { display: flex; align-items: center; gap: 8px; color: var(--text-sub); }
  .dl-dot { width: 9px; height: 9px; border-radius: 50%; }
  .dl-val { font-family: "DIN Alternate", monospace; font-weight: 500; }
  .rank-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--page); }
  .rank-row:last-child { border-bottom: none; }
  .rank-no { width: 22px; height: 22px; border-radius: 6px; background: var(--primary-50); color: var(--primary-800); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex: none; font-family: "DIN", monospace; }
  .rank-row.top1 .rank-no { background: var(--warning); color: #fff; }
  .rank-row.top2 .rank-no { background: var(--info); color: #fff; }
  .rank-row.top3 .rank-no { background: var(--primary-400); color: #fff; }
  .rank-name { width: 130px; flex: none; font-size: 13px; color: var(--text); }
  .rank-bar-bg { flex: 1; height: 10px; background: var(--page); border-radius: 6px; overflow: hidden; }
  .rank-bar { height: 100%; border-radius: 6px; background: var(--primary-600); }
  .rank-val { width: 52px; text-align: right; font-family: "DIN Alternate", monospace; font-weight: 500; font-size: 13px; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .data-table thead th { text-align: left; padding: 11px 16px; background: var(--primary-50); color: var(--primary-800); font-weight: 500; font-size: 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .data-table tbody td { padding: 10px 16px; border-bottom: 1px solid var(--page); color: var(--text-sub); white-space: nowrap; }
  .data-table tbody tr:hover { background: var(--page); }
  .data-table .t-first { color: var(--text); font-weight: 500; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }
  .pill.ok { background: var(--normal-bg); color: var(--normal); }
  .pill.warn { background: var(--info-bg); color: var(--warning); }
  .pill.bad { background: var(--block-bg); color: var(--block); }
  .pill.info { background: var(--primary-50); color: var(--primary-600); }
  .toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%) translateY(-12px); background: var(--text); color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 13px; z-index: 80; opacity: 0; transition: all 0.25s ease; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-sec); }
  /* === 侧边栏 v2：分组折叠 + 窄宽 + 新LOGO === */
  .logo-text { line-height: 1.25; min-width: 0; }
  .logo-name { font-size: 15px; font-weight: 500; color: #FFFFFF; letter-spacing: 0.3px; }
  .logo-slogan { font-size: 10.5px; color: #93B5D9; margin-top: 1px; }
  .nav-group-head { padding: 14px 16px 5px; font-size: 11px; color: #6FA9DA; letter-spacing: 0.6px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; user-select: none; transition: color 0.15s; }
  .nav-group-head:hover { color: #B5D4F4; }
  .nav-group-head > span:first-child { font-weight: 500; }
  .nav-caret { font-size: 10px; opacity: 0.75; transition: transform 0.18s; display: inline-block; }
  .nav-group-items { overflow: hidden; }
  .nav-group.collapsed .nav-caret { transform: rotate(-90deg); }
  .nav-group.collapsed .nav-group-items { display: none; }
  .sidebar-collapse { padding: 10px 16px; font-size: 12px; color: #85B7EB; cursor: pointer; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--primary-600); transition: all 0.15s; }
  .sidebar-collapse:hover { background: var(--primary-900); color: #B5D4F4; }
  .collapse-caret { display: inline-block; transition: transform 0.2s; font-size: 14px; line-height: 1; }
  .sidebar.collapsed .collapse-caret { transform: rotate(180deg); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="appSidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div class="breadcrumb"><a>数据报表</a><span>›</span><span class="current">质量 & 偏差追溯报表</span></div>
      <div class="topbar-right">
        <div id="plantSwitch"></div>
        <div id="roleSwitch"></div>
      <div class="user-info"><div class="avatar">陈</div><div><div class="user-name">陈有强</div><div class="user-role">生产计划主管</div></div></div>
      </div>
    </header>
    <div class="tabbar" id="tabBar"></div>
      <div class="content">
    
      <div class="page-header">
        <div><div class="page-title">质量 & 偏差追溯报表</div><div class="page-subtitle">一次合格率、偏差来源与 CAPA 闭环分析</div></div>
        <div class="header-actions"><button class="btn btn-secondary" onclick="DA.export()">⬇ 导出</button><button class="btn btn-primary" onclick="DA.refresh()">↻ 刷新</button></div>
      </div>
      <div class="filter-bar">
        <div class="filter-group"><span class="filter-label">时间范围</span><select class="filter-select" id="fRange" onchange="DA.render()"><option value="3">近3月</option><option value="6">近6月</option><option value="12" selected>近12月</option><option value="ytd">本年</option></select></div>
        <div class="filter-group"><span class="filter-label">车间</span><select class="filter-select" onchange="DA.render()"><option>全部车间</option><option>合成一车间</option><option>合成二车间</option><option>精制车间</option><option>制剂一车间</option><option>制剂二车间</option><option>中试车间</option></select></div>
        <div class="filter-group"><span class="filter-label">维度</span><select class="filter-select" onchange="DA.render()"><option>按车间</option><option>按产品</option><option>按批次</option></select></div>
      </div>
      <div class="metrics-row">
          <div class="metric-card blue"><div class="metric-label">一次合格率</div><div class="metric-value">98.5%<span class="trend up">▲ 0.6%</span></div><div class="metric-detail">环比 +0.6%</div></div>
          <div class="metric-card green"><div class="metric-label">偏差总数</div><div class="metric-value">23<span class="trend down">▼ 5</span></div><div class="metric-detail">环比 -5</div></div>
          <div class="metric-card amber"><div class="metric-label">CAPA 闭环率</div><div class="metric-value">91.3%<span class="trend up">▲ 4.2%</span></div><div class="metric-detail">环比 +4.2%</div></div>
          <div class="metric-card gray"><div class="metric-label">退货 / 召回</div><div class="metric-value">0<span class="trend ">—</span></div><div class="metric-detail">本年度</div></div>
      </div>
      <div class="dash-grid">
        <div class="card span2 chart">
          <div class="card-header"><div class="card-title"><span class="dot" style="background:#1D9E75"></span>月度一次合格率(%)</div><div class="card-sub">目标 97.5%</div></div>
          <div class="card-body" id="c_line"></div>
        </div>
        <div class="card chart">
          <div class="card-header"><div class="card-title"><span class="dot" style="background:#D85A30"></span>偏差来源 TOP</div><div class="card-sub">按偏差数</div></div>
          <div class="card-body" id="c_hbar"></div>
        </div>
        <div class="card chart">
          <div class="card-header"><div class="card-title"><span class="dot" style="background:#185FA5"></span>偏差类型分布</div><div class="card-sub"></div></div>
          <div class="card-body"><div class="donut-wrap"><div id="c_donut" style="flex:none;"></div><div class="donut-legend"></div></div></div>
        </div>
        <div class="card span2" style="margin-top:16px;">
          <div class="card-header"><div class="card-title"><span class="dot" style="background:var(--primary-400)"></span>明细数据</div><div class="card-sub">共 6 行</div></div>
          <div class="card-body" style="padding:0;"><div style="overflow-x:auto;"><table class="data-table"><thead><tr><th>偏差编号</th><th>类型</th><th>关联批次</th><th>严重度</th><th>状态</th><th>责任车间</th><th>发生日期</th></tr></thead><tbody id="dt"></tbody></table></div></div>
        </div>

    </div></div>

<div class="toast" id="toast"></div>
<script src="sidebar.js"></script>
<script>
  function $(id){ return document.getElementById(id); }
  function fmt(v){ return (Math.round(v*10)/10).toString(); }
  function sum(a){ var s=0; for(var i=0;i<a.length;i++) s+=a[i]; return s; }
  var PAL=['#185FA5','#1D9E75','#EF9F27','#D85A30','#378ADD','#5DCAA5','#9B6DDE','#E08A3C'];
  function lineSVG(series, labels, cfg){
    cfg=cfg||{}; var w=cfg.w||820,h=cfg.h||250; var pad={l:46,r:16,t:18,b:30};
    var plotW=w-pad.l-pad.r, plotH=h-pad.t-pad.b;
    var vals=[]; series.forEach(function(s){ s.data.forEach(function(v){ vals.push(v); }); }); if(cfg.target!=null) vals.push(cfg.target);
    var ymin=cfg.ymin!=null?cfg.ymin:Math.floor(Math.min.apply(null,vals)*0.95);
    var ymax=cfg.ymax!=null?cfg.ymax:Math.ceil(Math.max.apply(null,vals)*1.05); if(ymin===ymax) ymax=ymin+1;
    function X(i){ return pad.l+(labels.length<=1?plotW/2:plotW*i/(labels.length-1)); }
    function Y(v){ return pad.t+plotH*(1-(v-ymin)/(ymax-ymin)); }
    var svg='<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block;">';
    for(var g=0;g<=4;g++){ var gv=ymin+(ymax-ymin)*g/4, gy=Y(gv);
      svg+='<line x1="'+pad.l+'" y1="'+gy+'" x2="'+(w-pad.r)+'" y2="'+gy+'" stroke="#EDEBE3" stroke-width="1"/>';
      svg+='<text x="'+(pad.l-6)+'" y="'+(gy+4)+'" text-anchor="end" font-size="11" fill="#888780" font-family="DIN Alternate,Roboto,monospace">'+fmt(gv)+'</text>'; }
    var stepX=labels.length<=12?1:Math.ceil(labels.length/12);
    for(var i=0;i<labels.length;i++){ if(i%stepX!==0 && i!==labels.length-1) continue;
      svg+='<text x="'+X(i)+'" y="'+(h-10)+'" text-anchor="middle" font-size="11" fill="#888780">'+labels[i]+'</text>'; }
    if(cfg.target!=null){ svg+='<line x1="'+pad.l+'" y1="'+Y(cfg.target)+'" x2="'+(w-pad.r)+'" y2="'+Y(cfg.target)+'" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="4 3"/>';
      svg+='<text x="'+(w-pad.r)+'" y="'+(Y(cfg.target)-4)+'" text-anchor="end" font-size="10" fill="#D85A30">目标 '+fmt(cfg.target)+'</text>'; }
    series.forEach(function(s){
      if(s.fill){ var area='M'+X(0)+' '+Y(s.data[0]); for(var i=0;i<s.data.length;i++) area+=' L'+X(i)+' '+Y(s.data[i]);
        area+=' L'+X(s.data.length-1)+' '+(pad.t+plotH)+' L'+X(0)+' '+(pad.t+plotH)+' Z'; svg+='<path d="'+area+'" fill="'+s.color+'" opacity="0.10"/>'; }
      var d=''; for(var i=0;i<s.data.length;i++) d+=(i===0?'M':'L')+X(i)+' '+Y(s.data[i])+' ';
      svg+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
      for(var i=0;i<s.data.length;i++){ svg+='<circle cx="'+X(i)+'" cy="'+Y(s.data[i])+'" r="2.6" fill="'+s.color+'"/>'; } });
    svg+='</svg>'; return svg;
  }
  function barSVG(items, cfg){
    cfg=cfg||{}; var w=cfg.w||440,h=cfg.h||250; var pad={l:40,r:12,t:14,b:26};
    var plotW=w-pad.l-pad.r, plotH=h-pad.t-pad.b; var max=0; items.forEach(function(it){ if(it.value>max) max=it.value; });
    max=Math.ceil(max*1.1/100)*100; if(max===0) max=1;
    function Y(v){ return pad.t+plotH*(1-v/max); }
    var svg='<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block;">';
    for(var g=0;g<=4;g++){ var gv=max*g/4, gy=Y(gv);
      svg+='<line x1="'+pad.l+'" y1="'+gy+'" x2="'+(w-pad.r)+'" y2="'+gy+'" stroke="#EDEBE3" stroke-width="1"/>';
      svg+='<text x="'+(pad.l-6)+'" y="'+(gy+4)+'" text-anchor="end" font-size="11" fill="#888780" font-family="DIN Alternate,monospace">'+gv+'</text>'; }
    var n=items.length, bw=plotW/n*0.56, gap=plotW/n;
    items.forEach(function(it,i){ var x=pad.l+gap*i+(gap-bw)/2, y=Y(it.value), bh=pad.t+plotH-y, col=it.color||PAL[i%PAL.length];
      svg+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="4" fill="'+col+'"/>';
      svg+='<text x="'+(x+bw/2)+'" y="'+(y-5)+'" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="DIN Alternate,monospace">'+it.value+'</text>';
      svg+='<text x="'+(x+bw/2)+'" y="'+(h-9)+'" text-anchor="middle" font-size="10" fill="#888780">'+it.name+'</text>'; });
    svg+='</svg>'; return svg;
  }
  function donutSVG(items){
    var total=sum(items.map(function(d){return d.value;})); var r=58,cx=78,cy=78,sw=24; var circ=2*Math.PI*r, off=0;
    var svg='<svg viewBox="0 0 156 156" style="width:156px;height:156px;flex:none;">';
    svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#EDEBE3" stroke-width="'+sw+'"/>';
    items.forEach(function(d){ var len=circ*d.value/total;
      svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+d.color+'" stroke-width="'+sw+'" stroke-dasharray="'+len+' '+(circ-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 '+cx+' '+cy+')"/>'; off+=len; });
    svg+='<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="20" font-weight="500" fill="#2C2C2A" font-family="DIN Alternate,monospace">'+total+'</text>';
    svg+='<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" font-size="10" fill="#888780">合计</text>'; svg+='</svg>'; return svg;
  }
  function hbar(items){ var maxv=Math.max.apply(null,items.map(function(d){return d.value;})); var h="";
    items.forEach(function(d,i){ var top=i<3?' top'+(i+1):'';
      h+="<div class='rank-row'"+top+"'><div class='rank-no'>"+(i+1)+"</div><div class='rank-name'>"+d.name+"</div>";

  function rangeIdx(range){ var n=parseInt(range,10); if(isNaN(n)) n=12; var start=MONTHS.length-n; if(start<0) start=0; var arr=[]; for(var i=start;i<MONTHS.length;i++) arr.push(i); return arr; }
  function sliceArr(a,idx){ return idx.map(function(i){ return a[i]; }); }

  function render(){
    var range=$("fRange").value; var idx=rangeIdx(range);
    CH.forEach(function(c){ var el=$(c.id); if(!el) return; var d=D[c.ref];
      if(c.kind==="line"){ var labs=sliceArr(MONTHS,idx); var ss=c.series.map(function(s){ return {color:s.color,fill:s.fill,data:sliceArr(s.data,idx)}; }); el.innerHTML=lineSVG(ss,labs,c.cfg||{}); }
      else if(c.kind==="bar"){ el.innerHTML=barSVG(d,c.cfg||{}); }
      else if(c.kind==="donut"){ el.innerHTML=donutSVG(d); var total=sum(d.map(function(x){return x.value;})); var lg=""; d.forEach(function(x){ var pct=(x.value/total*100).toFixed(1); lg+="<div class=\"dl-row\"><div class=\"dl-left\"><span class=\"dl-dot\" style=\"background:"+x.color+"\"></span>"+x.name+"</div><div><span class=\"dl-val\">"+x.value+"</span> <span style=\"color:var(--text-sec);font-size:11px;\">"+pct+"%</span></div></div>"; }); var lw=el.parentElement.querySelector(".donut-legend"); if(lw) lw.innerHTML=lg; }
      else if(c.kind==="hbar"){ el.innerHTML=hbar(d); }
    });
    var tb=$("dt"); if(tb){ var rh=""; D.table.rows.forEach(function(row){ rh+="<tr>"+row.map(function(c2,i){ return "<td"+(i===0?" class=\"t-first\"":"")+">"+c2+"</td>"; }).join("")+"</tr>"; }); tb.innerHTML=rh; }
