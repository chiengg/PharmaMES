<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MES 精细化工 - 建设中</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary-50: #E6F1FB; --primary-200: #B5D4F4; --primary-400: #378ADD;
    --primary-600: #185FA5; --primary-800: #0C447C; --primary-900: #042C53;
    --normal: #1D9E75; --normal-bg: #E1F5EE;
    --info: #EF9F27; --info-bg: #FAEEDA;
    --warning: #D85A30; --warning-bg: #FAECE7;
    --block: #E24B4A; --block-bg: #FCEBEB;
    --white: #FFFFFF; --page: #F1EFE8; --border: #D3D1C7;
    --text-sec: #888780; --text-sub: #5F5E5A; --text: #2C2C2A;
  }
  body { font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif; background: var(--page); color: var(--text); font-size: 14px; line-height: 1.6; overflow: hidden; height: 100vh; }
  .app { display: flex; height: 100vh; }

  .sidebar { width: 200px; min-width: 200px; background: var(--primary-800); color: #85B7EB; display: flex; flex-direction: column; overflow-y: auto; }
  .sidebar-logo { padding: 14px 16px; border-bottom: 1px solid var(--primary-600); display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; flex: none; }
  .sidebar-nav { padding: 8px 0; flex: 1; }
  .nav-item { padding: 8px 16px 8px 36px; font-size: 12.5px; color: #85B7EB; cursor: pointer; position: relative; transition: all 0.15s; display: flex; align-items: center; gap: 7px; }
  .nav-item:hover { background: var(--primary-900); color: #B5D4F4; }
  .nav-item.active { background: var(--primary-600); color: #FFF; font-weight: 500; }
  .nav-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--primary-400); }
  .nav-section-title { padding: 16px 20px 6px; font-size: 11px; color: #378ADD; letter-spacing: 0.5px; }
  .sidebar-footer { padding: 12px 20px; border-top: 1px solid var(--primary-600); font-size: 12px; color: #5DCAA5; display: flex; align-items: center; gap: 6px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--normal); }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { height: 52px; min-height: 52px; background: var(--white); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
  .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-sec); }
  .breadcrumb .current { color: var(--text); font-weight: 500; }
  .breadcrumb a { color: var(--text-sec); text-decoration: none; cursor: pointer; }
  .breadcrumb a:hover { color: var(--primary-600); }
  .user-info { display: flex; align-items: center; gap: 10px; padding: 4px 8px; border-radius: 8px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary-600); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; }
  .user-name { font-size: 13px; color: var(--text); }
  .user-role { font-size: 11px; color: var(--text-sec); }

  .content { flex: 1; overflow-y: auto; padding: 14px 28px; display: flex; align-items: flex-start; justify-content: center; }
  .card { background: var(--white); border-radius: 12px; border: 1px solid var(--border); max-width: 720px; width: 100%; margin-top: 48px; }
  .card-body { padding: 48px 56px; text-align: center; }
  .build-icon { width: 88px; height: 88px; margin: 0 auto 20px; border-radius: 50%; background: var(--info-bg); display: flex; align-items: center; justify-content: center; font-size: 38px; }
  .build-title { font-size: 20px; font-weight: 500; margin-bottom: 10px; }
  .status-tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 14px; font-size: 12px; font-weight: 500; background: var(--info-bg); color: #633806; margin-bottom: 16px; }
  .status-tag .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--info); }
  .build-desc { font-size: 13px; color: var(--text-sec); line-height: 2; margin-bottom: 26px; }
  .plan { text-align: left; background: var(--page); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 28px; }
  .plan h4 { font-size: 11px; color: var(--text-sec); letter-spacing: 0.5px; margin-bottom: 10px; font-weight: 500; }
  .plan ul { list-style: none; }
  .plan li { font-size: 13px; color: var(--text-sub); padding: 5px 0 5px 18px; position: relative; }
  .plan li::before { content: '·'; position: absolute; left: 4px; top: 3px; color: var(--primary-400); font-size: 20px; }
  .btns { display: flex; gap: 10px; justify-content: center; }
  .btn { padding: 8px 18px; border-radius: 8px; font-size: 13px; cursor: pointer; border: none; font-family: inherit; transition: all 0.15s; }
  .btn-primary { background: var(--primary-600); color: #fff; }
  .btn-primary:hover { background: var(--primary-800); }
  .btn-secondary { background: var(--white); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--primary-400); color: var(--primary-600); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* === 侧边栏 v2：分组折叠 + 窄宽 + 新LOGO === */
  .logo-text { line-height: 1.25; min-width: 0; }
  .logo-name { font-size: 15px; font-weight: 500; color: #FFFFFF; letter-spacing: 0.3px; }
  .logo-slogan { font-size: 10.5px; color: #93B5D9; margin-top: 1px; }
  .nav-group-head { padding: 14px 16px 5px; font-size: 11px; color: #6FA9DA; letter-spacing: 0.6px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; user-select: none; transition: color 0.15s; }
  .nav-group-head:hover { color: #B5D4F4; }
  .nav-group-head > span:first-child { font-weight: 500; }
  .nav-caret { font-size: 10px; opacity: 0.75; transition: transform 0.18s; display: inline-block; }
  .nav-group-items { overflow: hidden; }
  .nav-group.collapsed .nav-caret { transform: rotate(-90deg); }
  .nav-group.collapsed .nav-group-items { display: none; }
  .sidebar-collapse { padding: 10px 16px; font-size: 12px; color: #85B7EB; cursor: pointer; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--primary-600); transition: all 0.15s; }
  .sidebar-collapse:hover { background: var(--primary-900); color: #B5D4F4; }
  .collapse-caret { display: inline-block; transition: transform 0.2s; font-size: 14px; line-height: 1; }
  .sidebar.collapsed .collapse-caret { transform: rotate(180deg); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="appSidebar"></aside>

  <div class="main">
    <header class="topbar">
      <div class="breadcrumb">
        <a onclick="window.location.href='生产监控大屏.html'">首页</a>
        <span>›</span>
        <span class="current" id="crumbName">建设中</span>
      </div>
      <div id="plantSwitch"></div>
        <div id="roleSwitch"></div>
      <div class="user-info">
        <div class="avatar">张</div>
        <div><div class="user-name">张明</div><div class="user-role">车间主管</div></div>
      </div>
    </header>

    <div class="tabbar" id="tabBar"></div>
      <div class="content">
    
      <div class="card">
        <div class="card-body">
          <div class="build-icon">🚧</div>
          <div class="build-title" id="moduleTitle">该模块建设中</div>
          <div class="status-tag"><span class="dot"></span><span id="phaseText">原型阶段 · 尚未设计</span></div>
          <div class="build-desc">
            本模块已纳入产品规划，但当前原型版本尚未完成页面设计。<br>
            如需提前排期，请在需求评审会上提出，并同步至产品负责人确认优先级。
          </div>
          <div class="plan">
            <h4>规划范围（待需求评审确认）</h4>
            <ul id="planList"></ul>
          </div>
          <div class="btns">
            <button class="btn btn-secondary" onclick="history.back()">← 返回上一页</button>
            <button class="btn btn-primary" onclick="location.href='生产监控大屏.html'">回到监控大屏</button>
          </div>
        </div>
      </div>
    
    </div></div>
  </div>


<script>
  var PLAN = {
    '变更管理': [
      'BOM / 工艺变更申请单发起、撤回与作废',
      '多级审批流（工艺 → 质量 → 生产）与会签规则配置',
      '变更影响范围分析（在制釜次、在库物料、关联标准动作）',
      '变更生效版本切换、灰度范围与回滚机制',
      '全流程留痕与电子签名（满足 GMP / 数据完整性要求）'
    ],
    '标准动作库': [
      '动作分类树（前处理 / 反应 / 后处理 / 包装）与全量检索',
      '动作模板新增、编辑、停用与版本管理',
      '动作参数区间、SOP 附件、安全提示维护',
      '动作与工序、设备、岗位资质的关联关系管理',
      '动作复用率与执行合格率统计看板'
    ],
    '数据接口': [
      'DCS / PLC 点位映射、采集频率与量纲换算配置',
      'ERP 物料主数据、生产工单、库存的双向同步',
      'LIMS 检验任务下发与检验结果回传规则',
      '接口健康度监控、失败重试队列与告警通知',
      '接口调用日志、报文留存与问题追溯'
    ],
    '决策分析': [
      '釜次收率、物料单耗、能耗的多维下钻分析',
      '批次成本还原与差异归因（物料 / 人工 / 制造费用）',
      '动作偏差 TOP 排行与根因分析',
      '设备 OEE、产能瓶颈识别与排产建议',
      '自定义报表、订阅推送与数据导出'
    ]
  };
  var m = new URLSearchParams(location.search).get('m') || '未命名模块';
  document.getElementById('moduleTitle').textContent = m + ' · 建设中';
  document.getElementById('crumbName').textContent = m;
  document.title = 'MES 精细化工 - ' + m + '（建设中）';
  var list = PLAN[m] || ['功能范围待需求评审确认'];
  document.getElementById('planList').innerHTML = list.map(function (t) { return '<li>' + t + '</li>'; }).join('');
  document.querySelectorAll('.nav-item').forEach(function (i) {
    if (i.textContent.indexOf(m) > -1) i.classList.add('active');
  });
</script>
  <script src="sidebar.js"></script>
  <script src="plant.js"></script>
<script src="role.js"></script>
</body>
</html>
