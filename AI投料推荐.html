<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MES 制药 - AI 投料推荐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary-50: #E6F1FB; --primary-200: #B5D4F4; --primary-400: #378ADD;
    --primary-600: #185FA5; --primary-800: #0C447C; --primary-900: #042C53;
    --normal: #1D9E75; --normal-bg: #E1F5EE;
    --info: #EF9F27; --info-bg: #FAEEDA;
    --warning: #D85A30; --warning-bg: #FAECE7;
    --block: #E24B4A; --block-bg: #FCEBEB;
    --ai: #7B54C9; --ai-bg: #F1EBFB; --ai-soft: #ECE3FA;
    --white: #FFFFFF; --page: #F1EFE8; --border: #D3D1C7;
    --text-sec: #888780; --text-sub: #5F5E5A; --text: #2C2C2A;
  }
  body { font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif; background: var(--page); color: var(--text); font-size: 14px; line-height: 1.6; overflow: hidden; height: 100vh; }
  .app { display: flex; height: 100vh; }
  .sidebar { width: 200px; min-width: 200px; background: var(--primary-800); color: #85B7EB; display: flex; flex-direction: column; overflow-y: auto; }
  .sidebar-logo { padding: 14px 16px; border-bottom: 1px solid var(--primary-600); display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; flex: none; }
  .sidebar-nav { padding: 8px 0; flex: 1; }
  .nav-item { padding: 8px 16px 8px 36px; font-size: 12.5px; color: #85B7EB; cursor: pointer; position: relative; transition: all 0.15s; display: flex; align-items: center; gap: 7px; }
  .nav-item:hover { background: var(--primary-900); color: #B5D4F4; }
  .nav-item.active { background: var(--primary-600); color: #FFF; font-weight: 500; }
  .nav-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--primary-400); }
  .nav-group { margin-top: 4px; }
  .nav-group-head { padding: 10px 16px 6px; font-size: 11px; color: #6FA8E0; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; display:flex; justify-content:space-between; align-items:center; }
  .nav-caret { font-size: 9px; color:#5A8FCB; transition: transform 0.18s; display: inline-block; }
  .nav-group-items { overflow: hidden; }
  .nav-group.collapsed .nav-caret { transform: rotate(-90deg); }
  .nav-group.collapsed .nav-group-items { display: none; }
  .sidebar-footer { padding: 12px 20px; border-top: 1px solid var(--primary-600); font-size: 12px; color: #5DCAA5; display: flex; align-items: center; gap: 6px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--normal); }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { height: 52px; min-height: 52px; background: var(--white); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
  .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-sec); }
  .breadcrumb .current { color: var(--text); font-weight: 500; }
  .topbar-right { display: flex; align-items: center; gap: 20px; }
  .user-info { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--ai); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; }
  .user-name { font-size: 13px; color: var(--text); }
  .user-role { font-size: 11px; color: var(--text-sec); }
  .content { flex: 1; overflow-y: auto; padding: 14px 28px; }
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .page-title { font-size: 22px; font-weight: 500; color: var(--text); }
  .page-subtitle { font-size: 13px; color: var(--text-sec); margin-top: 2px; }
  .header-actions { display: flex; gap: 10px; }
  .btn { padding: 8px 18px; border-radius: 8px; font-size: 13px; cursor: pointer; border: none; font-family: inherit; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
  .btn-primary { background: var(--ai); color: #fff; }
  .btn-primary:hover { background: #6645ad; }
  .btn-secondary { background: var(--white); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--ai); color: var(--ai); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .metrics-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .metric-card { background: var(--white); border-radius: 10px; padding: 14px 16px; border: 1px solid var(--border); position: relative; overflow: hidden; }
  .metric-card .metric-label { font-size: 12px; color: var(--text-sec); }
  .metric-card .metric-value { font-size: 24px; font-weight: 600; margin-top: 4px; }
  .metric-card .metric-detail { font-size: 11px; color: var(--text-sec); margin-top: 2px; }
  .metric-card.ai { background: var(--ai-soft); border-color: #D9C9F2; }

  .grid-2 { display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; }
  .card { background: var(--white); border-radius: 12px; padding: 16px 18px; border: 1px solid var(--border); margin-bottom: 16px; }
  .card-title { font-size: 15px; font-weight: 600; color: var(--text); display:flex; align-items:center; gap:8px; margin-bottom: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display:inline-block; }

  .field { margin-bottom: 13px; }
  .field label { font-size: 12.5px; color: var(--text-sub); display:block; margin-bottom: 5px; }
  .field select, .field input[type=number] { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; background: var(--white); color: var(--text); }
  .slider-row { display:flex; align-items:center; gap:10px; }
  .slider-row input[type=range]{ flex:1; }
  .slider-val { font-size: 12.5px; font-weight:600; color: var(--ai); width: 64px; text-align:right; font-family: ui-monospace, monospace; }

  table.dose { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.dose th { text-align: left; padding: 9px 10px; background: var(--ai-soft); color: var(--text-sub); font-weight: 600; border-bottom: 1px solid #D9C9F2; position: sticky; top: 0; }
  table.dose td { padding: 10px; border-bottom: 1px solid #EEEAE2; vertical-align: middle; }
  table.dose tr:hover td { background: #FCFBFE; }
  .mat-name { font-weight: 600; color: var(--text); }
  .mat-code { font-size: 11px; color: var(--text-sec); font-family: ui-monospace, monospace; }
  .rec-val { font-weight: 700; color: var(--ai); font-family: ui-monospace, monospace; font-size: 14px; }
  .delta { font-family: ui-monospace, monospace; font-size: 12px; }
  .delta.up { color: var(--warning); }
  .delta.down { color: var(--normal); }
  .delta.zero { color: var(--text-sec); }

  .conf-bar { width: 70px; height: 7px; border-radius: 4px; background: #ECE3FA; overflow: hidden; display:inline-block; vertical-align: middle; margin-right: 6px; }
  .conf-bar > i { display:block; height:100%; background: var(--ai); }
  .conf-txt { font-size: 12px; font-family: ui-monospace, monospace; color: var(--text-sub); }

  .factors { display:flex; flex-direction:column; gap:8px; }
  .factor { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px; background:#FAF9FE; border:1px solid #ECE3FA; }
  .factor .f-tag { font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; background:var(--ai); color:#fff; min-width:62px; text-align:center; }
  .factor .f-bar { flex:1; height:8px; border-radius:4px; background:#ECE3FA; overflow:hidden; }
  .factor .f-bar > i { display:block; height:100%; background:var(--ai); }
  .factor .f-val { font-size:12px; font-family:ui-monospace, monospace; color:var(--text-sub); min-width:74px; text-align:right; }

  .risk { padding: 10px 12px; border-radius: 9px; font-size: 13px; margin-bottom: 8px; }
  .risk.warn { background: var(--warning-bg); color: var(--warning); border: 1px solid #F2D2C7; }
  .risk.ok { background: var(--normal-bg); color: var(--normal); border: 1px solid #C7EADD; }
  .risk.info { background: var(--info-bg); color: #B9791B; border: 1px solid #F2E0C2; }

  .formula { font-size: 12px; color: var(--text-sub); background: #FAF9FE; border: 1px solid #ECE3FA; border-radius: 9px; padding: 12px 14px; font-family: ui-monospace, monospace; line-height: 1.9; white-space: pre-wrap; }
  details summary { cursor: pointer; color: var(--ai); font-size: 13px; font-weight: 600; padding: 4px 0; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: var(--text); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; opacity: 0; transition: all .25s; z-index: 999; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .pill-info { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--ai-soft); color: var(--ai); font-weight: 600; }
  .applied-note { font-size:12px; color:var(--normal); background:var(--normal-bg); border:1px solid #C7EADD; border-radius:8px; padding:8px 12px; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .applied-note.hidden { display:none; }
</style>
</head>
<body>
<div class="app">
  <!-- 侧边栏（与全站一致，此处 AI 投料推荐 为当前页） -->
  <aside class="sidebar" id="appSidebar"></aside>

  <div class="main">
    <header class="topbar">
      <div class="breadcrumb">
        <a onclick="window.location.href='称量配料.html'">物料&设备</a>
        <span>›</span>
        <span class="current">AI 投料推荐</span>
      </div>
      <div class="topbar-right">
        <div id="plantSwitch"></div>
        <div id="roleSwitch"></div>
        <div class="user-info"><div class="avatar">AI</div><div><div class="user-name">智能投料助手</div><div class="user-role">AI 推荐引擎</div></div></div>
      </div>
    </header>

    <div class="tabbar" id="tabBar"></div>
      <div class="content">
    
      <div class="page-header">
        <div>
          <div class="page-title">AI 投料推荐</div>
          <div class="page-subtitle">基于 BOM 基准 + 工艺因子补偿的称量投料推荐 · 水分/收率/校准/环境多维优化 · 可一键下发至配料单</div>
        </div>
        <div class="header-actions">
          <button class="btn btn-secondary" onclick="AI.reset()">↺ 重置参数</button>
          <button class="btn btn-primary" id="btnApply" onclick="AI.apply()">🤖 应用推荐到配料单</button>
        </div>
      </div>

      <div class="metrics-row">
        <div class="metric-card ai"><div class="metric-label">推荐物料项</div><div class="metric-value" id="mAiItems">—</div><div class="metric-detail">本配方参与计算的物料数</div></div>
        <div class="metric-card"><div class="metric-label">平均置信度</div><div class="metric-value" id="mAiConf">—</div><div class="metric-detail">综合数据质量与因子稳定度</div></div>
        <div class="metric-card"><div class="metric-label">总推荐投料</div><div class="metric-value" id="mAiTotal">—</div><div class="metric-detail">kg · 含补偿调整</div></div>
        <div class="metric-card"><div class="metric-label">风险等级</div><div class="metric-value" id="mAiRisk">—</div><div class="metric-detail" id="mAiRiskD">—</div></div>
      </div>

      <div class="grid-2">
        <!-- 左：输入 -->
        <div>
          <div class="card">
            <div class="card-title"><span class="dot" style="background:var(--ai)"></span>投料条件</div>
            <div class="field">
              <label>产品（工艺配方）</label>
              <select id="fProd" onchange="AI.run()">
                <option value="AMX">阿莫西林胶囊</option>
                <option value="IBU">布洛芬缓释胶囊</option>
                <option value="CEF">头孢氨苄颗粒</option>
                <option value="PAR">对乙酰氨基酚片</option>
                <option value="ASP">阿司匹林肠溶片</option>
              </select>
            </div>
            <div class="field">
              <label>批次投料量 (kg)</label>
              <input type="number" id="fBatch" value="500" min="50" step="50" oninput="AI.run()">
            </div>
            <div class="field">
              <label>称量设备 / 产线</label>
              <select id="fScale" onchange="AI.run()">
                <option value="E01">电子秤 E-01（±0.5%）</option>
                <option value="E02">电子秤 E-02（±0.3%）</option>
                <option value="L1">自动配料线 L-1（±0.2%）</option>
              </select>
            </div>
          </div>

          <div class="card">
            <div class="card-title"><span class="dot" style="background:var(--info)"></span>工艺因子（补偿输入）</div>
            <div class="field">
              <label>原料水分 <span style="color:var(--text-sec)">（标称 8.0%）</span></label>
              <div class="slider-row"><input type="range" id="fMoist" min="5" max="12" step="0.1" value="8.5" oninput="AI.slider('moist')"><span class="slider-val" id="vMoist">8.5%</span></div>
            </div>
            <div class="field">
              <label>历史批收率 <span style="color:var(--text-sec)">（目标 98.0%）</span></label>
              <div class="slider-row"><input type="range" id="fYield" min="90" max="99" step="0.1" value="96.5" oninput="AI.slider('yield')"><span class="slider-val" id="vYield">96.5%</span></div>
            </div>
            <div class="field">
              <label>设备校准漂移</label>
              <div class="slider-row"><input type="range" id="fCal" min="-1" max="1" step="0.1" value="-0.3" oninput="AI.slider('cal')"><span class="slider-val" id="vCal">-0.3%</span></div>
            </div>
            <div class="field">
              <label>环境相对湿度 <span style="color:var(--text-sec)">（基准 55%）</span></label>
              <div class="slider-row"><input type="range" id="fHum" min="35" max="80" step="1" value="55" oninput="AI.slider('hum')"><span class="slider-val" id="vHum">55%</span></div>
            </div>
          </div>
        </div>

        <!-- 右：推荐结果 -->
        <div>
          <div id="appliedNote" class="applied-note hidden"></div>
          <div class="card">
            <div class="card-title"><span class="dot" style="background:var(--ai)"></span>AI 投料推荐明细 <span class="pill-info">每 100kg 基准 × 批次量 缩放</span></div>
            <div style="overflow-x:auto;">
              <table class="dose" id="doseTable">
                <thead><tr><th>物料</th><th>标准量</th><th>AI 推荐量</th><th>调整</th><th>公差带 (±1%)</th><th>置信度</th></tr></thead>
                <tbody id="doseBody"></tbody>
              </table>
            </div>
          </div>

          <div class="card">
            <div class="card-title"><span class="dot" style="background:var(--info)"></span>主要调整因子（按影响排序）</div>
            <div class="factors" id="factorBox"></div>
          </div>

          <div class="card">
            <div class="card-title"><span class="dot" style="background:var(--warning)"></span>风险提示与结论</div>
            <div id="riskBox"></div>
            <details style="margin-top:10px;">
              <summary>查看推荐计算逻辑</summary>
              <div class="formula" id="formulaBox"></div>
            </details>
          </div>
        </div>
      </div>
    
    </div></div>
  </div>


<div class="toast" id="toast"></div>

<script src="sidebar.js"></script>
<script src="plant.js"></script>
<script src="role.js"></script>
<script>
/* ===================== AI 投料推荐 逻辑 ===================== */
var AI = (function(){
  /* BOM 基准：每 100kg 产品的标准投料量 (kg) */
  var BOM = {
    AMX: [ {name:'阿莫西林原料',code:'MAT-A001',base:25.0}, {name:'纯化水(溶剂)',code:'MAT-B014',base:60.0}, {name:'助流剂',code:'MAT-C007',base:1.2}, {name:'玉米淀粉(辅料)',code:'MAT-D003',base:13.8} ],
    IBU: [ {name:'布洛芬原料',code:'MAT-A011',base:30.0}, {name:'HPMC 包衣液',code:'MAT-B021',base:8.0}, {name:'微晶纤维素',code:'MAT-D010',base:55.0}, {name:'硬脂酸镁',code:'MAT-C013',base:1.5} ],
    CEF: [ {name:'头孢氨苄原料',code:'MAT-A020',base:28.0}, {name:'蔗糖(矫味)',code:'MAT-D022',base:50.0}, {name:'香精',code:'MAT-D024',base:2.0}, {name:'纯化水',code:'MAT-B014',base:20.0} ],
    PAR: [ {name:'对乙酰氨基酚',code:'MAT-A030',base:32.0}, {name:'预胶化淀粉',code:'MAT-D031',base:55.0}, {name:'低取代羟丙基',code:'MAT-D033',base:8.0}, {name:'硬脂酸镁',code:'MAT-C013',base:1.2} ],
    ASP: [ {name:'阿司匹林原料',code:'MAT-A040',base:27.0}, {name:'肠溶包衣粉',code:'MAT-B041',base:9.0}, {name:'乳糖',code:'MAT-D044',base:61.0}, {name:'滑石粉',code:'MAT-C047',base:1.0} ]
  };
  var SCALE_TOL = { E01:0.005, E02:0.003, L1:0.002 }; /* 设备固有公差 */

  function $(id){ return document.getElementById(id); }
  function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},1800); }

  function slider(which){
    var v = {
      moist: $('fMoist').value, yield: $('fYield').value,
      cal: $('fCal').value, hum: $('fHum').value
    };
    $('vMoist').textContent = parseFloat(v.moist).toFixed(1)+'%';
    $('vYield').textContent = parseFloat(v.yield).toFixed(1)+'%';
    $('vCal').textContent = parseFloat(v.cal).toFixed(1)+'%';
    $('vHum').textContent = parseFloat(v.hum)+'%';
    run();
  }

  /* 核心推荐引擎 */
  function calc(){
    var prod = $('fProd').value;
    var batch = parseFloat($('fBatch').value) || 500;
    var scale = $('fScale').value;
    var moist = parseFloat($('fMoist').value);
    var yld = parseFloat($('fYield').value);
    var cal = parseFloat($('fCal').value);
    var hum = parseFloat($('fHum').value);

    var scaleK = batch / 100;            /* 批次缩放系数 */
    var items = BOM[prod].map(function(m){
      var base = m.base * scaleK;
      /* 补偿因子（单位：相对基准的比例） */
      var fMoist = (moist - 8.0) * 0.9 / 100;               /* 水分每超 1% 主料补 0.9% */
      var fYield = (98.0 - yld) * 1.5 / 100;                /* 收率每缺 1% 补 1.5% */
      var fCal   = -cal / 100;                             /* 校准漂移反向补偿 */
      var fHum   = (hum - 55) * 0.002;                     /* 湿度每超 1% 微调 0.2% */
      var rec = base * (1 + fMoist + fYield + fCal + fHum);
      /* 置信度：因子扰动越小越可信 */
      var perturb = Math.abs(fMoist)+Math.abs(fYield)+Math.abs(fCal)+Math.abs(fHum);
      var conf = Math.max(0.62, Math.min(0.99, 0.99 - perturb*0.9));
      var tol = base * SCALE_TOL[scale];
      return {
        name:m.name, code:m.code, base:base, rec:rec, tol:tol, conf:conf,
        delta: rec - base,
        factors:{ 水分补偿:fMoist, 收率补偿:fYield, 校准补偿:fCal, 环境补偿:fHum }
      };
    });

    /* 排序因子影响 */
    var factorAgg = {};
    items.forEach(function(it){ for(var k in it.factors){ factorAgg[k]=(factorAgg[k]||0)+Math.abs(it.factors[k]); } });
    var factorList = Object.keys(factorAgg).map(function(k){ return {k:k, v:factorAgg[k]}; })
      .sort(function(a,b){ return b.v - a.v; });

    var total = items.reduce(function(s,it){ return s+it.rec; }, 0);
    var avgConf = items.reduce(function(s,it){ return s+it.conf; }, 0) / items.length;
    var maxPerturb = Math.max.apply(null, items.map(function(it){ return Math.abs(it.delta)/it.base; }));

    return { prod:prod, batch:batch, scale:scale, items:items, factorList:factorList,
             total:total, avgConf:avgConf, maxPerturb:maxPerturb };
  }

  function fmt(n){ return n.toFixed(2); }
  function cls(d){ return d>0.005?'up':(d<-0.005?'down':'zero'); }
  function dtag(d){ return d>0?('+'+d.toFixed(2)):d.toFixed(2); }

  function render(){
    var r = calc();
    var html='';
    r.items.forEach(function(it){
      html += '<tr>'+
        '<td><div class="mat-name">'+it.name+'</div><div class="mat-code">'+it.code+'</div></td>'+
        '<td>'+fmt(it.base)+' kg</td>'+
        '<td class="rec-val">'+fmt(it.rec)+' kg</td>'+
        '<td class="delta '+cls(it.delta)+'">'+dtag(it.delta)+'</td>'+
        '<td>±'+fmt(it.tol)+' kg</td>'+
        '<td><span class="conf-bar"><i style="width:'+(it.conf*100).toFixed(0)+'%"></i></span><span class="conf-txt">'+(it.conf*100).toFixed(0)+'%</span></td>'+
      '</tr>';
    });
    $('doseBody').innerHTML = html;

    /* 因子条 */
    var maxF = Math.max.apply(null, r.factorList.map(function(f){return f.v;}));
    $('factorBox').innerHTML = r.factorList.map(function(f){
      var pct = (f.v/maxF*100).toFixed(0);
      return '<div class="factor"><span class="f-tag">'+f.k+'</span>'+
        '<span class="f-bar"><i style="width:'+pct+'%"></i></span>'+
        '<span class="f-val">+'+(f.v*100).toFixed(2)+'%</span></div>';
    }).join('');

    /* 风险与结论 */
    var risks = [];
    if (r.maxPerturb > 0.04) risks.push({c:'warn', t:'⚠ 单物料补偿幅度超 4%，建议复核工艺稳定性后再投料'});
    else risks.push({c:'ok', t:'✓ 补偿幅度在工艺允许范围内，可安全投料'});
    if ($('fCal').value < -0.5) risks.push({c:'warn', t:'⚠ 设备校准漂移偏大（'+$('fCal').value+'%），建议先执行期间核查'});
    if ($('fMoist').value > 10) risks.push({c:'info', t:'ℹ 原料水分偏高（'+$('fMoist').value+'%），已按水分补偿上调主料，关注干燥失重'});
    if ($('fYield').value < 94) risks.push({c:'warn', t:'⚠ 历史收率偏低（'+$('fYield').value+'%），补偿量较大，关注尾料与得率'});
    if (r.avgConf < 0.7) risks.push({c:'warn', t:'⚠ 平均置信度偏低（'+(r.avgConf*100).toFixed(0)+'%），因子扰动大，建议人工确认'});
    $('riskBox').innerHTML = risks.map(function(x){ return '<div class="risk '+x.c+'">'+x.t+'</div>'; }).join('');

    /* 公式说明 */
    $('formulaBox').textContent =
      '推荐量 = 基准量 × 批次缩放('+r.batch+'/100)\n'+
      '       × (1 + 水分补偿 + 收率补偿 + 校准补偿 + 环境补偿)\n\n'+
      '水分补偿 = (水分% − 8.0) × 0.9%\n'+
      '收率补偿 = (98.0 − 收率%) × 1.5%\n'+
      '校准补偿 = −漂移%\n'+
      '环境补偿 = (湿度% − 55) × 0.2%\n\n'+
      '置信度 = 0.99 − Σ|因子扰动|×0.9（下限 62%）\n'+
      '公差带 = 基准量 × 设备固有公差('+(SCALE_TOL[r.scale]*100).toFixed(1)+'%)';

    /* 指标卡 */
    $('mAiItems').textContent = r.items.length;
    $('mAiConf').textContent = (r.avgConf*100).toFixed(0)+'%';
    $('mAiTotal').textContent = fmt(r.total)+' kg';
    var riskLabel = r.maxPerturb>0.04 || r.avgConf<0.7 ? '偏高' : '低';
    $('mAiRisk').textContent = riskLabel;
    $('mAiRisk').style.color = riskLabel==='低' ? 'var(--normal)' : 'var(--warning)';
    $('mAiRiskD').textContent = (r.maxPerturb*100).toFixed(1)+'% 最大补偿';
  }

  function run(){ render(); }

  function apply(){
    var r = calc();
    var payload = {
      product: $('fProd').options[$('fProd').selectedIndex].text,
      batch: r.batch, scale: r.scale,
      items: r.items.map(function(it){ return { name:it.name, code:it.code, rec:+it.rec.toFixed(3), tol:+it.tol.toFixed(3) }; }),
      ts: new Date().toLocaleString('zh-CN')
    };
    localStorage.setItem('mes_ai_dose', JSON.stringify(payload));
    showApplied(payload);
    toast('已应用 AI 推荐至配料单（可在称量配料页查看）', '🤖');
  }

  function showApplied(p){
    var n = $('appliedNote');
    n.classList.remove('hidden');
    n.innerHTML = '✓ <span style="font-weight:600">AI 推荐基准已应用</span>：'+p.product+' · 批次 '+p.batch+'kg · '+p.items.length+' 项物料（'+p.ts+'）— 已写入 <code>mes_ai_dose</code>，称量配料页将展示推荐基准。';
  }

  function reset(){
    $('fProd').value='AMX'; $('fBatch').value=500; $('fScale').value='E01';
    $('fMoist').value=8.5; $('fYield').value=96.5; $('fCal').value=-0.3; $('fHum').value=55;
    slider('all'); render();
  }

  function init(){
    /* 若此前已应用推荐，展示回执 */
    try {
      var saved = JSON.parse(localStorage.getItem('mes_ai_dose')||'null');
      if (saved) showApplied(saved);
    } catch(e){}
    render();
  }

  return { run:run, slider:slider, apply:apply, reset:reset, init:init };
})();
window.addEventListener('DOMContentLoaded', AI.init);
</script>
</body>
</html>
